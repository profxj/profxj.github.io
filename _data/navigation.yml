# The following is the order of the links in the header of the website.
#
# Changing the order here will adjust the order and you can also add additional
# links. Removing a link prevents it from showing in the header, but does not
# prevent it from being included in the site (the page/collection still builds).
#
# The four sections for profxj.github.io:
#   Publications -> /publications/   (_pages/publications.html, _publications collection)
#   Software     -> /portfolio/      ("Software" is the relabeled _portfolio collection)
#   Blog/News    -> /year-archive/   (_pages/year-archive.html, _posts)
#   Contact      -> /contact/        (_pages/contact.md -- created in Task 4)
#
# Talks / Teaching / CV / Guide are intentionally omitted from the menu; their
# pages and collections remain in the repo, just unlinked from the header.

main:
  - title: "Publications"
    url: /publications/

  - title: "Software"
    url: /portfolio/

  - title: "Blog/News"
    url: /year-archive/

  - title: "Contact"
    url: /contact/
